<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lujane Yaffa &mdash; Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
<style>
  main.admin { max-width: 720px; }
  .login-box { max-width: 320px; margin: 4rem auto; display: grid; gap: 0.75rem; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .row a, .row button.link { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; background: none; border: none; cursor: pointer; color: var(--muted); }
  .painting-form { display: grid; gap: 0.6rem; border: 1px solid var(--line); padding: 1.5rem; margin-bottom: 2.5rem; }
  .painting-form label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.2rem; }
  .list-item { border: 1px solid var(--line); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .list-item .row-top { display: flex; gap: 1rem; align-items: flex-start; }
  .list-item img { width: 72px; height: 90px; object-fit: cover; background: #f5f5f5; flex-shrink: 0; }
  .list-item .meta { flex: 1; }
  .list-item .meta h3 { margin: 0 0 0.2rem; font-size: 0.95rem; }
  .list-item .meta p { margin: 0.15rem 0; font-size: 0.8rem; color: var(--muted); }
  .list-item .actions { display: flex; gap: 0.5rem; flex-direction: column; }
  .list-item .actions button { font: inherit; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.4rem 0.6rem; border: 1px solid var(--line); background: var(--paper); cursor: pointer; }
  .list-item .actions button.danger { border-color: #b3261e; color: #b3261e; }
  select { font: inherit; padding: 0.5rem; border: 1px solid var(--line); background: var(--paper); }
  .edit-panel { display: grid; gap: 0.6rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .edit-panel label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.2rem; }
  .existing-images { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .existing-images figure { margin: 0; text-align: center; font-size: 0.68rem; color: var(--muted); }
  .existing-images img { width: 64px; height: 80px; object-fit: cover; background: #f5f5f5; display: block; }
  .existing-images label { display: flex; align-items: center; gap: 0.3rem; justify-content: center; margin-top: 0.25rem; font-size: 0.65rem; text-transform: none; letter-spacing: 0; }
  .edit-actions { display: flex; gap: 0.5rem; }
  .edit-actions button.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  h2.section-heading { font-size: 0.9rem; letter-spacing: 0.05em; margin: 3rem 0 1rem; }
  .commission-item { border: 1px solid var(--line); padding: 1rem 1.25rem; margin-bottom: 1rem; display: flex; gap: 1rem; justify-content: space-between; align-items: flex-start; }
  .commission-item .meta h3 { margin: 0 0 0.2rem; font-size: 0.9rem; }
  .commission-item .meta p { margin: 0.15rem 0; font-size: 0.8rem; color: var(--muted); }
  .commission-item .meta .desc { margin-top: 0.5rem; color: #333; white-space: pre-wrap; font-size: 0.85rem; }
  .commission-item button.danger { font: inherit; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.4rem 0.6rem; background: var(--paper); cursor: pointer; border-color: #b3261e; color: #b3261e; flex-shrink: 0; }
</style>
</head>
<body>
<header class="site">
  <h1>Lujane Yaffa</h1>
  <p>Admin</p>
  <nav class="tabs">
    <a href="index.html">Gallery</a>
    <a href="commission.html">Request a commission</a>
  </nav>
</header>

<main class="admin">
  <div id="loginView" class="login-box" hidden>
    <input type="password" id="passwordInput" placeholder="Admin password" />
    <button class="primary" id="loginBtn">Log in</button>
    <p class="msg error" id="loginMsg"></p>
  </div>

  <div id="dashboardView" hidden>
    <div class="row">
      <a href="index.html">&larr; view site</a>
      <button class="link" id="logoutBtn">Log out</button>
    </div>

    <form class="painting-form" id="createForm">
      <div>
        <label>Title</label>
        <input type="text" name="title" required />
      </div>
      <div>
        <label>Description</label>
        <textarea name="description" rows="3"></textarea>
      </div>
      <div>
        <label>Starting price ($)</label>
        <input type="number" name="startingBid" min="0" step="1" required />
      </div>
      <div>
        <label>Photos</label>
        <input type="file" name="images" accept="image/*" multiple />
      </div>
      <button class="primary" type="submit">Add painting</button>
      <p class="msg" id="createMsg"></p>
    </form>

    <div id="list"></div>

    <h2 class="section-heading">Commission requests</h2>
    <div id="commissionsList"></div>
  </div>
</main>

<script>
const TOKEN_KEY = 'art_admin_token';

const loginView = document.getElementById('loginView');
const dashboardView = document.getElementById('dashboardView');

function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

function setToken(token) {
  if (token) localStorage.setItem(TOKEN_KEY, token);
  else localStorage.removeItem(TOKEN_KEY);
}

function money(n) {
  return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showDashboard() {
  loginView.hidden = true;
  dashboardView.hidden = false;
  loadList();
  loadCommissions();
}

async function loadCommissions() {
  const container = document.getElementById('commissionsList');
  const res = await authFetch('/api/admin/commissions');
  const { commissions } = await res.json();

  if (!commissions.length) {
    container.innerHTML = '<p class="empty-state">No commission requests yet.</p>';
    return;
  }

  container.innerHTML = commissions
    .map(
      (c) => `
        <div class="commission-item" data-id="${c.id}">
          <div class="meta">
            <h3>${escapeHtml(c.name)}</h3>
            <p>${escapeHtml(c.email)} ${c.budget ? '&middot; ' + escapeHtml(c.budget) : ''}</p>
            <p>${new Date(c.createdAt).toLocaleDateString()}</p>
            <p class="desc">${escapeHtml(c.description)}</p>
          </div>
          <button class="danger delete-commission-btn">Delete</button>
        </div>`
    )
    .join('');

  container.querySelectorAll('.commission-item').forEach((item) => {
    item.querySelector('.delete-commission-btn').addEventListener('click', async () => {
      if (!confirm('Delete this commission request?')) return;
      await authFetch(`/api/admin/commissions/${item.dataset.id}`, { method: 'DELETE' });
      loadCommissions();
    });
  });
}

function showLogin() {
  loginView.hidden = false;
  dashboardView.hidden = true;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const msg = document.getElementById('loginMsg');
  const password = document.getElementById('passwordInput').value;
  msg.textContent = '';
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || 'Login failed');
    setToken(out.token);
    showDashboard();
  } catch (err) {
    msg.textContent = err.message;
  }
});

document.getElementById('passwordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  setToken(null);
  showLogin();
});

const MAX_DIMENSION = 1600;
const JPEG_QUALITY = 0.82;

function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, MAX_DIMENSION / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(
        (blob) => {
          if (!blob || blob.size >= file.size) return resolve(file);
          resolve(new File([blob], file.name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg' }));
        },
        'image/jpeg',
        JPEG_QUALITY
      );
    };
    img.onerror = () => resolve(file);
    img.src = url;
  });
}

async function compressFormImages(fd) {
  const files = fd.getAll('images');
  if (!files.length) return;
  fd.delete('images');
  for (const file of files) {
    if (file instanceof File && file.size > 0) {
      fd.append('images', await compressImage(file));
    }
  }
}

async function authFetch(url, options = {}) {
  options.headers = options.headers || {};
  options.headers['Authorization'] = `Bearer ${getToken()}`;
  const res = await fetch(url, options);
  if (res.status === 401) {
    setToken(null);
    showLogin();
    throw new Error('Session expired');
  }
  return res;
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('createMsg');
  const form = e.target;
  msg.textContent = '';
  msg.className = 'msg';
  try {
    const fd = new FormData(form);
    await compressFormImages(fd);
    const r = await authFetch('/api/admin/paintings', { method: 'POST', body: fd });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || 'Could not add painting');
    form.reset();
    msg.textContent = 'Added.';
    msg.className = 'msg ok';
    loadList();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg error';
  }
});

async function loadList() {
  const res = await fetch('/api/paintings');
  const { paintings } = await res.json();
  const list = document.getElementById('list');

  if (!paintings.length) {
    list.innerHTML = '<p class="empty-state">No paintings yet.</p>';
    return;
  }

  list.innerHTML = paintings
    .map((p) => {
      const img = p.images && p.images[0] ? `<img src="/api/images/${p.images[0]}" alt="" loading="lazy" decoding="async">` : '';
      const existingImages = (p.images || [])
        .map(
          (imgId) => `
            <figure>
              <img src="/api/images/${imgId}" alt="" loading="lazy" decoding="async">
              <label><input type="checkbox" name="removeImage" value="${imgId}"> remove</label>
            </figure>`
        )
        .join('');
      return `
        <div class="list-item" data-id="${p.id}">
          <div class="row-top">
            ${img}
            <div class="meta">
              <h3>${escapeHtml(p.title)}</h3>
              <p>${money(p.currentBid)} &middot; ${p.bidCount || 0} bid${p.bidCount === 1 ? '' : 's'}</p>
              <label>Status
                <select class="status-select">
                  <option value="available" ${p.status === 'available' ? 'selected' : ''}>Available</option>
                  <option value="sold" ${p.status === 'sold' ? 'selected' : ''}>Sold</option>
                  <option value="archived" ${p.status === 'archived' ? 'selected' : ''}>Archived (hidden)</option>
                </select>
              </label>
            </div>
            <div class="actions">
              <button class="edit-btn">Edit</button>
              <button class="danger delete-btn">Delete</button>
            </div>
          </div>
          <form class="edit-panel" hidden>
            <div>
              <label>Title</label>
              <input type="text" name="title" value="${escapeHtml(p.title)}" required />
            </div>
            <div>
              <label>Description</label>
              <textarea name="description" rows="3">${escapeHtml(p.description || '')}</textarea>
            </div>
            ${
              existingImages
                ? `<div>
                    <label>Current photos (check to remove)</label>
                    <div class="existing-images">${existingImages}</div>
                  </div>`
                : ''
            }
            <div>
              <label>Add photos</label>
              <input type="file" name="images" accept="image/*" multiple />
            </div>
            <div class="edit-actions">
              <button class="primary" type="submit">Save</button>
              <button class="secondary cancel-edit-btn" type="button">Cancel</button>
            </div>
            <p class="msg" data-edit-msg></p>
          </form>
        </div>`;
    })
    .join('');

  list.querySelectorAll('.list-item').forEach((item) => {
    const id = item.dataset.id;
    const panel = item.querySelector('.edit-panel');

    item.querySelector('.status-select').addEventListener('change', async (e) => {
      const fd = new FormData();
      fd.append('status', e.target.value);
      await authFetch(`/api/admin/paintings/${id}`, { method: 'PUT', body: fd });
    });

    item.querySelector('.delete-btn').addEventListener('click', async () => {
      if (!confirm('Delete this painting? This cannot be undone.')) return;
      await authFetch(`/api/admin/paintings/${id}`, { method: 'DELETE' });
      loadList();
    });

    item.querySelector('.edit-btn').addEventListener('click', () => {
      panel.hidden = !panel.hidden;
    });

    item.querySelector('.cancel-edit-btn').addEventListener('click', () => {
      panel.hidden = true;
    });

    panel.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = panel.querySelector('[data-edit-msg]');
      msg.textContent = '';
      msg.className = 'msg';
      try {
        const fd = new FormData(panel);
        await compressFormImages(fd);
        const r = await authFetch(`/api/admin/paintings/${id}`, { method: 'PUT', body: fd });
        const out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Could not save changes');
        loadList();
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg error';
      }
    });
  });
}

if (getToken()) {
  showDashboard();
} else {
  showLogin();
}
</script>
</body>
</html>
