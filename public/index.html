<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lujane Yaffa</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site">
  <h1>Lujane Yaffa</h1>
  <p>Original paintings &mdash; place a bid to make one yours</p>
  <nav class="tabs">
    <a href="index.html" class="active">Gallery</a>
    <a href="commission.html">Request a commission</a>
  </nav>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state" hidden>No paintings listed yet. Check back soon.</div>
</main>

<footer class="site">
  <a class="social" href="https://instagram.com/lujaneyaffa" target="_blank" rel="noopener" aria-label="Instagram">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1"/></svg>
  </a>
  <a href="admin.html">admin</a>
</footer>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <button class="close" id="closeModal">Close</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');

document.getElementById('closeModal').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

function closeModal() {
  overlay.hidden = true;
  modalBody.innerHTML = '';
  history.replaceState(null, '', location.pathname);
}

function money(n) {
  return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadPaintings() {
  const res = await fetch('/api/paintings');
  const data = await res.json();
  const paintings = data.paintings || [];
  if (!paintings.length) {
    emptyState.hidden = false;
    return;
  }
  grid.innerHTML = paintings
    .filter((p) => p.status !== 'archived')
    .map((p) => {
      const img = p.images && p.images[0] ? `<img src="/api/images/${p.images[0]}" alt="" loading="lazy" decoding="async">` : '';
      return `
        <button class="card" data-id="${p.id}">
          <div class="thumb ${img ? '' : 'empty'}">${img || 'No photo'}</div>
          <h2>${escapeHtml(p.title)}</h2>
          ${p.status === 'sold' ? '<span class="status">Sold</span>' : ''}
        </button>`;
    })
    .join('');

  grid.querySelectorAll('.card').forEach((card) => {
    card.addEventListener('click', () => openPainting(card.dataset.id));
  });

  const initial = new URLSearchParams(location.search).get('painting');
  if (initial) openPainting(initial);
}

async function openPainting(id) {
  const res = await fetch(`/api/paintings/${id}`);
  if (!res.ok) return;
  const { painting, bids } = await res.json();
  history.replaceState(null, '', `?painting=${id}`);

  const images = (painting.images || [])
    .map((imgId) => `<img src="/api/images/${imgId}" alt="" loading="lazy" decoding="async">`)
    .join('');

  const soldOut = painting.status !== 'available';

  const bidHistory = bids && bids.length
    ? `<ul class="bid-history">${bids
        .slice(0, 8)
        .map((b) => `<li><span>${escapeHtml(b.name)}</span><span>${money(b.amount)}</span></li>`)
        .join('')}</ul>`
    : '';

  modalBody.innerHTML = `
    ${images || ''}
    <h2>${escapeHtml(painting.title)}</h2>
    <p class="desc">${escapeHtml(painting.description || '')}</p>
    <div class="bid-box">
      ${
        soldOut
          ? `<div class="current"><small>${painting.status === 'sold' ? 'Sold' : 'Not available'}</small></div>`
          : `<div class="current"><small>Starting price</small>${money(painting.startingBid)}</div>
             <button class="primary" id="showBidFormBtn">Place a bid</button>
             <form class="bid-form" id="bidForm" hidden>
               <input type="text" name="name" placeholder="Your name" required />
               <input type="email" name="email" placeholder="Email (so we can reach you if you win)" required />
               <input type="number" name="amount" min="${painting.currentBid + 1}" step="1" placeholder="Your bid (min ${money(painting.currentBid + 1)})" required />
               <button class="primary" type="submit">Place bid</button>
               <p class="msg" id="bidMsg"></p>
             </form>`
      }
      ${bidHistory}
    </div>
  `;
  overlay.hidden = false;

  const showBidFormBtn = document.getElementById('showBidFormBtn');
  const form = document.getElementById('bidForm');
  if (showBidFormBtn) {
    showBidFormBtn.addEventListener('click', () => {
      showBidFormBtn.hidden = true;
      form.hidden = false;
      form.querySelector('input').focus();
    });
  }
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('bidMsg');
      const submitBtn = form.querySelector('button');
      submitBtn.disabled = true;
      msg.textContent = '';
      msg.className = 'msg';
      const fd = new FormData(form);
      try {
        const r = await fetch('/api/bids', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            paintingId: id,
            name: fd.get('name'),
            email: fd.get('email'),
            amount: Number(fd.get('amount')),
          }),
        });
        const out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Something went wrong');
        msg.textContent = 'Bid placed! Reopening this piece with your bid recorded.';
        msg.className = 'msg ok';
        await loadPaintings();
        setTimeout(() => openPainting(id), 600);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg error';
        submitBtn.disabled = false;
      }
    });
  }
}

loadPaintings();
</script>
</body>
</html>
