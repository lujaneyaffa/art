name: Setup collections

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup
        env:
          ART_ADMIN_PASSWORD: ${{ secrets.ART_ADMIN_PASSWORD }}
        run: node import/setup-collections.mjs
