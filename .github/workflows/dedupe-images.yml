name: Dedupe painting images

on:
  workflow_dispatch: {}

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dedupe
        env:
          ART_ADMIN_PASSWORD: ${{ secrets.ART_ADMIN_PASSWORD }}
        run: node import/dedupe-images.mjs
