name: Import paintings

on:
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import
        env:
          ART_ADMIN_PASSWORD: ${{ secrets.ART_ADMIN_PASSWORD }}
        run: node import/import-paintings.mjs
