name: Restore Selection One

on:
  workflow_dispatch: {}

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restore
        env:
          ART_ADMIN_PASSWORD: ${{ secrets.ART_ADMIN_PASSWORD }}
        run: node import/restore-selection-one.mjs
